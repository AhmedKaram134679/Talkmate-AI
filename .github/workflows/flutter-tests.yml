name: Flutter Tests & CI/CD Hardening

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter Analyze & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter SDK Version Constraints
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analysis (Zero Warnings Gate)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Core Unit & Repository Test Suite
        run: flutter test -r compact

      - name: Run Integration Tests Dry-Run Check
        run: flutter test test/integration/ --no-pub || true

      - name: Dry-Run Android APK Build (No-codesign)
        run: flutter build apk --debug

  windows-build-matrix:
    name: Windows Desktop Dry-Run Build
    runs-on: windows-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Dry-Run Windows Desktop Release Build
        run: flutter build windows --release
