name: talkmate_ai
description: A comprehensive chat platform supporting text, voice, and video communication for all user groups.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Core packages
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  collection: ^1.18.0

  # UI packages
  cached_network_image: ^3.3.0

  # Firebase (multi-platform)

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Storage & utilities
  path_provider: ^2.1.4
  uuid: ^4.2.1
  timeago: ^3.6.0
  path: ^1.8.3
  package_info_plus: ^8.3.1
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.7

  # Notifications
  flutter_local_notifications: ^19.4.1
  # flutter_app_badger: ^1.5.0 # Removed due to AGP 8.0 Namespace Incompatibility

  # Permissions
  permission_handler: ^12.0.1

  # Audio/Video

  wakelock_plus: ^1.2.5
  firebase_core: ^4.1.0
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.6
  firebase_performance: ^0.11.1+3
  firebase_messaging: ^16.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  record: ^5.2.1
  media_kit: ^1.1.10
  media_kit_libs_windows_audio: any
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  http: ^1.4.0
  # WebRTC for Calls
  flutter_webrtc:
    path: third_party/flutter_webrtc
  connectivity_plus: ^7.0.0
  flutter_foreground_task: ^6.1.1
  flutter_callkit_incoming: ^2.0.2

  # Supabase Integration (Complete Backend)
  supabase_flutter: ^2.8.1
  realtime_client: ^2.7.0
  rxdart: ^0.28.0
  app_links: ^6.3.2
  receive_sharing_intent: ^1.8.1
  window_manager: ^0.5.1
  sqlite3_flutter_libs: ^0.5.41
  simple_pip_mode: ^1.1.0
  animations: ^2.1.1
  crypto: ^3.0.7
  flutter_secure_storage: ^10.0.0
  audio_session: ^0.2.2
  media_kit_libs_android_audio: ^1.3.8
  sqlite3: ^2.4.0

dependency_overrides:
  # Fix platform interface mismatch causing RecordLinux to miss startStream implementation
  record_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/app-icon/
    - assets/backgrounds/
    - assets/icons/
    - assets/illustrations/
    - assets/images/
    - assets/logo/
    - assets/sounds/
    - assets/json/
    - assets/uiComponents/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
